name: 📺 Live TV Premium APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: live-tv-premium-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Apply app logo from URL (optional)
        run: |
          LOGO_URL=$(grep -oP 'REMOTE_LOGO_URL = "\K[^"]*' app/src/main/java/com/livetv/premium/BrandConfig.kt || true)
          if [ -n "$LOGO_URL" ]; then
            echo "Downloading logo: $LOGO_URL"
            if curl -fsSL --max-time 40 "$LOGO_URL" -o /tmp/logo_raw; then
              if command -v magick >/dev/null 2>&1; then CONVERT="magick"; else CONVERT="convert"; fi
              if $CONVERT "/tmp/logo_raw[0]" -resize 512x512 -background none -gravity center -extent 512x512 PNG32:/tmp/app_logo.png; then
                mkdir -p app/src/main/res/drawable-nodpi
                cp /tmp/app_logo.png app/src/main/res/drawable-nodpi/app_logo.png
                rm -f app/src/main/res/drawable/app_logo.xml
                echo "Launcher icon updated from URL"
              else
                echo "Logo conversion failed - keeping default icon"
              fi
            else
              echo "Logo download failed - keeping default icon"
            fi
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: LiveTV-Premium-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
